<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>mimi</title>
    $partial("src/templates/imports.html")$
</head>

<body class="home-page">

    <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
        <symbol id="icon-settings" viewBox="0 0 24 24">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </symbol>
    </svg>

    <div class="bg-overlay">
        <!-- populated with randomized clouds/notes by src/ts/home/sky.ts -->
        <svg class="bg-sky" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    </div>

    <header class="home-header">
        <div class="home-title">
            <a href="$path$/" class="site-name" aria-label="mimi">
                $partial("src/templates/logo.html")$
            </a>
        </div>
        <div class="home-lang">
            $partial("src/templates/lang_toggle.html")$
            $partial("src/templates/theme_toggle.html")$
            $partial("src/templates/settings_toggle.html")$
        </div>
    </header>

    <main class="home-main">
        <div id="home-root"
            data-info-content='$info-content$'
            data-info-content-jp='$info-content-jp$'
            data-tutorial-content='$tutorial-content$'
            data-tutorial-content-jp='$tutorial-content-jp$'
            data-songs-manifest='$songs-manifest$'></div>
    </main>

    <footer class="home-footer">
        <a href="https://github.com/Twigums/mimi" style="text-decoration: none;">
            <img src="$path$/images/logos/github-logo.svg" title="GitHub" alt="GitHub logo" />
        </a>
        <a href="https://jaspervdj.be/hakyll/" style="text-decoration: none;">
            <img src="$path$/images/logos/hakyll-logo.svg" title="Proudly generated by Hakyll" alt="Hakyll logo" />
        </a>
    </footer>

    <script src="$path$/js/main.js"></script>

</body>

</html>
