<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>mimi - Answer Me</title>
    <meta name = "site-path" content = "/mimi">
<link rel = "stylesheet" href = "/mimi/css/default.css" />
<link rel = "preconnect" href = "https://fonts.googleapis.com">
<link rel = "preconnect" href = "https://fonts.gstatic.com" crossorigin>
<link href = "https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=M+PLUS+Rounded+1c:wght@400;700;800&family=Yomogi&display=swap" rel = "stylesheet">

    <!-- Song-load critical path is all third-party: warm up DNS/TLS to the SDK CDN,
         Songle analysis API, TextAlive backend, and Piapro audio host so the
         handshakes overlap page parse instead of stacking before createFromSongUrl. -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://api.songle.jp" crossorigin>
    <link rel="preconnect" href="https://api.textalive.jp" crossorigin>
    <link rel="preconnect" href="https://piapro.jp" crossorigin>
    <link rel="dns-prefetch" href="https://unpkg.com">
    <link rel="dns-prefetch" href="https://api.songle.jp">
    <link rel="dns-prefetch" href="https://api.textalive.jp">
    <link rel="dns-prefetch" href="https://piapro.jp">

    <!-- Deferred in <head> so the SDK downloads during parse (ordered: axios -> textalive -> main);
         defer still runs main.js after the DOM is parsed, matching the old end-of-body placement. -->
    <script defer src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script defer src="https://unpkg.com/textalive-app-api/dist/index.js"></script>
    <script defer src="/mimi/js/main.js"></script>
</head>

<body class="song-page"
    data-hit-sound-url="/mimi/audio/snare.mp3"
    data-song-url="https://piapro.jp/t/6W2N/20251215164617"
    data-song-chart-dir="/mimi/songs/kotaete/"
    data-song-bpm="130"
    data-song-levels="{&quot;easy&quot;:1,&quot;medium&quot;:0,&quot;hard&quot;:4,&quot;expert&quot;:12}"
    data-textalive-token="N6S7A1HvahiwDLUg"
    data-textalive-beat-id="4827293"
    data-textalive-chord-id="2963754"
    data-textalive-repetitive-segment-id="3086261"
    data-textalive-lyric-id="126519"
    data-textalive-lyric-diff-id="28645"
    data-lyric-chorus-timings="songs/kotaete/chorus-timings.jsonc"
    data-song-name="Answer Me"
    data-song-name-jp="こたえて"
    data-song-author="imie"
    data-song-author-jp="imie"
    data-song-mapper="Twigums">

    <div id="loading-screen">
        <span class="loading-note" aria-hidden="true"></span>
        <div class="loading-bar-track">
            <div class="loading-bar-fill" id="loading-bar-fill"></div>
        </div>
        <span class="loading-text" data-en="Loading..." data-jp="ローディング...">Loading...</span>
        <span class="loading-hint" data-en="This is taking a while... try refreshing?" data-jp="少し時間がかかってる…　更新してみ？">This is taking a while... try refreshing?</span>
    </div>

    <div id="textalive-media"></div>
    <div class="bg-overlay"></div>

    <div class="song-progress-bar">
        <div class="song-progress-fill" id="progress-fill"></div>
    </div>

    <div class="song-hud">
        <button class="btn-hud-toggle" id="btn-hud-toggle" aria-label="Menu" title="Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"/>
            </svg>
        </button>
        <div class="hud-panel">
            <div class="hud-top-row">
                <button class = "lang-toggle" id = "lang-toggle" type = "button"
        role = "switch" aria-checked = "false"
        aria-label = "Toggle language between English and Japanese">
    <span class = "lang-option lang-en active" data-lang = "en">EN</span>
    <span class = "lang-option lang-jp" data-lang = "jp" data-compact = "JA">JA</span>
</button>
                <button class = "settings-btn theme-toggle" id = "theme-toggle" type = "button"
        role = "switch" aria-checked = "false"
        aria-label = "Toggle between light and dark theme"
        data-title-en = "Theme" data-title-jp = "テーマ"
        title = "Theme">
    <svg xmlns = "http://www.w3.org/2000/svg" viewBox = "0 0 24 24" aria-hidden = "true">
        <mask id = "theme-moon-mask">
            <rect x = "0" y = "0" width = "24" height = "24" fill = "white"/>
            <circle class = "theme-mask-bite" cx = "27" cy = "-3" r = "6" fill = "black"/>
        </mask>
        <circle class = "theme-icon-core" cx = "12" cy = "12" r = "5" mask = "url(#theme-moon-mask)"/>
        <g class = "theme-icon-rays">
            <path d = "M12 2.5 V5"/>
            <path d = "M12 19 V21.5"/>
            <path d = "M2.5 12 H5"/>
            <path d = "M19 12 H21.5"/>
            <path d = "M5.3 5.3 L7 7"/>
            <path d = "M17 17 L18.7 18.7"/>
            <path d = "M17 7 L18.7 5.3"/>
            <path d = "M5.3 18.7 L7 17"/>
        </g>
    </svg>
</button>

                <button class = "settings-btn" id = "settings-btn" type = "button"
        aria-label = "Open options"
        data-title-en = "Options" data-title-jp = "オプション"
        title = "Options">
    <svg xmlns = "http://www.w3.org/2000/svg" viewBox = "0 0 24 24" fill = "currentColor" aria-hidden = "true">
        <path d = "M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
    </svg>
</button>
            </div>
        </div>
    </div>

    <a href="/mimi/" class="site-name-link">mimi</a>

    <div class="small-screen-warning">
        <p data-en="Please play in fullscreen or increase your window size."
           data-jp="フルスクリーンで再生するか、ウィンドウサイズを大きくしてください。">Please play in fullscreen or increase your window size.</p>
    </div>

    <div id="game-root"></div>

    <div class="song-page-footer">
        <button class="btn-fullscreen" id="btn-fullscreen" title="Fullscreen">
            <svg class="icon-fullscreen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <g class="corner corner-tl"><path d="M3 9 L3 3 L9 3"/></g>
                <g class="corner corner-tr"><path d="M15 3 L21 3 L21 9"/></g>
                <g class="corner corner-br"><path d="M21 15 L21 21 L15 21"/></g>

            </svg>
            <svg class="icon-exit-fullscreen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <g class="corner corner-tl"><path d="M3 9 L9 9 L9 3"/></g>
                <g class="corner corner-tr"><path d="M15 3 L15 9 L21 9"/></g>
                <g class="corner corner-br"><path d="M21 15 L15 15 L15 21"/></g>
                <g class="corner corner-bl"><path d="M9 21 L9 15 L3 15"/></g>
            </svg>
        </button>
        <a href="/mimi/" class="btn-back" data-en="Back" data-jp="戻る">Back</a>
    </div>

</body>

</html>
