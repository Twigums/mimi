name: Build and Generate (on `docs` branch)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: haskell-actions/setup@v2.7
      id: setup-haskell
      with:
        ghc-version: '9.6.6'
        enable-stack: true
        stack-version: 'latest'

    # CACHES

    - name: Cache - stack global package db
      uses: actions/cache@v4
      with:
        path: ${{ steps.setup-haskell.outputs.stack-root }}
        key: ${{ runner.os }}-stack-global-${{ hashFiles('**/*.yaml') }}
        restore-keys: |
          ${{ runner.os }}-stack-global-

    - name: Cache - .stack-work
      uses: actions/cache@v4
      with:
        path: |
          .stack-work
          */.stack-work
        key: ${{ runner.os }}-stack-work-${{ hashFiles('**/*.yaml') }}
        restore-keys: |
          ${{ runner.os }}-stack-work-

    - name: Install npm dependencies
      run: npm install

    - name: Build app
      run: npm run setup # runs stack

    # Pages serves from <owner>.github.io (lowercased); sitemap URLs need it.
    - name: Resolve Pages origin
      run: |
        owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        echo "SITE_ORIGIN=https://${owner}.github.io" >> "$GITHUB_ENV"

    - name: Generate site
      env:
        # since I have a personal site, and the repo is hosted as a tab
        # the rest of the site must take that tab as root
        SITE_PATH: /${{ github.event.repository.name }}
      run: npm run rebuild

    - name: Deploy to branch
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/${{ github.event.repository.name }}
        publish_branch: docs
