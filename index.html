    <main class="home-main">
        <div id="home-root"
            data-info-content='&lt;h1 id=&quot;info&quot;&gt;Info&lt;/h1&gt;
&lt;p&gt;Hatsune Miku has lost her lyrics, and she needs your help to collect missing words! Mimi is an easy-to-learn rhythm game with cut notes, flow notes, and lyric notes. The objective is to beautifully swipe through the cut and flow notes and hold onto the lyric notes. The lyric notes are how you can help retrieve Miku’s words. By collecting these words, you can make her voice shine!&lt;/p&gt;
&lt;p&gt;Customize your cursor color and game properties to fit the your preferred experience. Change between day and night mode, change how fast each note appears on your screen, or change between English and Japanese! The choice is yours! The only thing we recommend is learning how mimi works through the tutorial.&lt;/p&gt;
&lt;p&gt;Feel free to play using your PC’s mouse or tablet’s touchscreen!&lt;/p&gt;
&lt;p&gt;This project was primarily made as a submission for &lt;a href=&quot;https://magicalmirai.com/2026/procon/index_en.html&quot;&gt;Magical Mirai 2026&lt;/a&gt;.&lt;/p&gt;
&lt;h2 id=&quot;credits&quot;&gt;Credits&lt;/h2&gt;
&lt;p&gt;Website: &lt;a href=&quot;https://github.com/Twigums&quot;&gt;Twigums&lt;/a&gt;, &lt;a href=&quot;https://github.com/vekt0r-github&quot;&gt;vekt0r-github&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;Assets: &lt;a href=&quot;https://github.com/Twigums&quot;&gt;Twigums&lt;/a&gt;, &lt;a href=&quot;https://www.instagram.com/acousticguichar?igsh=eXc0NnZmYjRpMXp2&quot;&gt;acousticguichar&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;Mapping: &lt;a href=&quot;https://github.com/vekt0r-github&quot;&gt;vekt0r-github&lt;/a&gt;, &lt;a href=&quot;https://osu.ppy.sh/users/2688103&quot;&gt;IOException&lt;/a&gt;&lt;/p&gt;'
            data-info-content-jp='&lt;h1 id=&quot;情報&quot;&gt;情報&lt;/h1&gt;
&lt;p&gt;&lt;strong&gt;mimi&lt;/strong&gt;には3種類のノーツがあります：&lt;/p&gt;
&lt;p&gt;&lt;mark class=&quot;cut&quot;&gt;&lt;a href=&quot;spawn:cut&quot;&gt;カット&lt;/a&gt;&lt;/mark&gt;：赤い矢印を指定方向にスワイプしてください。&lt;/p&gt;
&lt;p&gt;&lt;mark class=&quot;flow&quot;&gt;&lt;a href=&quot;spawn:flow&quot;&gt;フロー&lt;/a&gt;&lt;/mark&gt;：つながったノーツをなめらかにスワイプしてください。&lt;/p&gt;
&lt;p&gt;&lt;mark class=&quot;lyric&quot;&gt;&lt;a href=&quot;spawn:lyric&quot;&gt;歌詞&lt;/a&gt;&lt;/mark&gt;：初音ミクの歌に合わせ、歌が続く間はカーソルを歌詞サークルの中でキープしてください！&lt;/p&gt;
&lt;p&gt;各ノーツをクリックして、右のエリアで試してみてください。&lt;/p&gt;
&lt;h2 id=&quot;判定のポイント&quot;&gt;判定のポイント&lt;/h2&gt;
&lt;p&gt;&lt;strong&gt;mimi&lt;/strong&gt;のスワイプは美しくなければなりません！完璧なタイミングと正しい動きが必要です。具体的には、以下の点に注目しましょう：&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;タイミング&lt;/strong&gt;：スワイプが早すぎたり、遅すぎたりしていませんか？&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;接触&lt;/strong&gt;：スワイプはノーツの中心にどれだけ近かったですか？速すぎても遅すぎてもスコアが下がります！&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;方向&lt;/strong&gt;：正しい方向にスワイプしていますか？初音ミクが示す矢印の方向にスワイプしましょう。&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;ジェスチャー&lt;/strong&gt;：全体の動きはきれいですか？&lt;strong&gt;カット&lt;/strong&gt;ノーツはスパッと切り、&lt;strong&gt;フロー&lt;/strong&gt;ノーツはしっかり追いましょう！&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h2 id=&quot;設定&quot;&gt;設定&lt;/h2&gt;
&lt;p&gt;右上の設定アイコン &lt;svg class=&quot;inline-icon&quot;&gt;&lt;use href=&quot;#icon-settings&quot;/&gt;&lt;/svg&gt; をクリックすると、ゲームの設定を変更できます。テストプレイで確認しながら調整できます：&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;オーディオ&lt;/strong&gt;：ヒットサウンドや音楽のボリュームを調整できます。&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;ゲームプレイ&lt;/strong&gt;：デバイスによってはレイテンシーが発生するので、オフセットを調整してください（曲が遅れて感じる場合は数値を増やし、早く感じる場合は減らします）。ノーツの出現スピード（アプローチレート）も変更できます。&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;カーソル&lt;/strong&gt;：カーソルのサイズ、色、形、トレイルをカスタマイズしましょう！&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;&lt;strong&gt;mimi&lt;/strong&gt;を&lt;em&gt;あなた&lt;/em&gt;の&lt;strong&gt;マジカルミライ&lt;/strong&gt;に！&lt;/p&gt;
&lt;h2 id=&quot;クレジット&quot;&gt;クレジット&lt;/h2&gt;
&lt;p&gt;Webサイト：&lt;a href=&quot;https://github.com/Twigums&quot;&gt;Twigums&lt;/a&gt;、&lt;a href=&quot;https://github.com/vekt0r-github&quot;&gt;vekt0r-github&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;アセット：&lt;a href=&quot;https://github.com/Twigums&quot;&gt;Twigums&lt;/a&gt;、&lt;a href=&quot;https://www.instagram.com/acousticguichar?igsh=eXc0NnZmYjRpMXp2&quot;&gt;acousticguichar&lt;/a&gt;&lt;/p&gt;
&lt;p&gt;マップ：&lt;a href=&quot;https://github.com/vekt0r-github&quot;&gt;vekt0r-github&lt;/a&gt;、&lt;a href=&quot;https://osu.ppy.sh/users/2688103&quot;&gt;IOException&lt;/a&gt;&lt;/p&gt;'
            data-tutorial-content='&lt;h2 id=&quot;mimi&quot;&gt;mimi&lt;/h2&gt;
&lt;p&gt;In &lt;strong&gt;mimi&lt;/strong&gt;, we have 3 types of notes:&lt;/p&gt;
&lt;p&gt;&lt;mark class=&quot;cut&quot;&gt;&lt;a href=&quot;spawn:cut&quot;&gt;Cut&lt;/a&gt;&lt;/mark&gt;: Swipe through the red arrow in the marked direction.&lt;/p&gt;
&lt;p&gt;&lt;mark class=&quot;flow&quot;&gt;&lt;a href=&quot;spawn:flow&quot;&gt;Flow&lt;/a&gt;&lt;/mark&gt;: Keep a continuous motion through the connected notes.&lt;/p&gt;
&lt;p&gt;&lt;mark class=&quot;lyric&quot;&gt;&lt;a href=&quot;spawn:lyric&quot;&gt;Lyric&lt;/a&gt;&lt;/mark&gt;: Follow Miku’s singing — hold your cursor on the lyric circle while she holds the note!&lt;/p&gt;
&lt;p&gt;If you want to see what the notes look like, feel free to click on each of the notes and try it out in the game area to the right.&lt;/p&gt;
&lt;h2 id=&quot;issues&quot;&gt;Issues&lt;/h2&gt;
&lt;p&gt;&lt;strong&gt;mimi&lt;/strong&gt; swipes must be beautiful! This means that your swipe must have perfect timing and perfect movement. Specifially, you need to focus on:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Timing&lt;/strong&gt;: Was your swipe too early? Too late?&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Contact&lt;/strong&gt;: How close was your swipe to the note? Moving too fast or too slow hurts your score!&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Direction&lt;/strong&gt;: Are you swiping in the correct direction? Miku wants you to swipe in the direction of the arrow.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Gesture&lt;/strong&gt;: Is your overall movement clean? Make sure to swipe cleanly through &lt;strong&gt;cut&lt;/strong&gt; notes and follow &lt;strong&gt;flow&lt;/strong&gt; notes!&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h2 id=&quot;settings&quot;&gt;Settings&lt;/h2&gt;
&lt;p&gt;Click the settings icon, &lt;svg class=&quot;inline-icon&quot;&gt;&lt;use href=&quot;#icon-settings&quot;/&gt;&lt;/svg&gt;, on the top right to change game settings, with a live testplay to preview them as you go:&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Audio&lt;/strong&gt;: Increase or decrease the hitsound and music volumes.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Gameplay&lt;/strong&gt;: Some devices introduce latency, so play with the offset (raise it if the song feels too late, lower it if it feels too early). You can also change the approach rate — how fast notes appear — and try mods like Hidden if you want more of a challenge.&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;Cursor&lt;/strong&gt;: Feel free to customize your cursor’s size, color, shape, and trail.&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;Make &lt;strong&gt;mimi&lt;/strong&gt; &lt;em&gt;your&lt;/em&gt; &lt;strong&gt;Magical Mirai&lt;/strong&gt;!&lt;/p&gt;'
            data-tutorial-content-jp='&lt;h2 id=&quot;mimi&quot;&gt;mimi&lt;/h2&gt;
&lt;p&gt;&lt;strong&gt;mimi&lt;/strong&gt;には3種類のノーツがあります：&lt;/p&gt;
&lt;p&gt;&lt;mark class=&quot;cut&quot;&gt;&lt;a href=&quot;spawn:cut&quot;&gt;カット&lt;/a&gt;&lt;/mark&gt;：赤い矢印を指定方向にスワイプして。&lt;/p&gt;
&lt;p&gt;&lt;mark class=&quot;flow&quot;&gt;&lt;a href=&quot;spawn:flow&quot;&gt;フロー&lt;/a&gt;&lt;/mark&gt;：つながったノーツをなめらかにスワイプして。&lt;/p&gt;
&lt;p&gt;&lt;mark class=&quot;lyric&quot;&gt;&lt;a href=&quot;spawn:lyric&quot;&gt;歌詞&lt;/a&gt;&lt;/mark&gt;：ミクの歌に合わせ、歌が続く間はカーソルを歌詞サークルの中でキープして！&lt;/p&gt;
&lt;p&gt;各ノーツをクリックして、右のゲームエリアで試してみてください。&lt;/p&gt;
&lt;h2 id=&quot;課題&quot;&gt;課題&lt;/h2&gt;
&lt;p&gt;&lt;strong&gt;mimi&lt;/strong&gt;のスワイプは美しくなければなりません！つまり、完璧なタイミングと完璧な動きが必要です。具体的には、次の点に注目しましょう：&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;タイミング&lt;/strong&gt;：スワイプが早すぎませんでしたか？遅すぎませんでしたか？&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;接触&lt;/strong&gt;：スワイプはノーツにどれだけ近かったですか？速すぎても遅すぎてもスコアが下がります！&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;方向&lt;/strong&gt;：正しい方向にスワイプしていますか？ミクは矢印の方向にスワイプしてほしいのです。&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;ジェスチャー&lt;/strong&gt;：全体の動きはきれいですか？&lt;strong&gt;カット&lt;/strong&gt;ノーツはきれいに切り、&lt;strong&gt;フロー&lt;/strong&gt;ノーツはしっかり追いましょう！&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;h2 id=&quot;設定&quot;&gt;設定&lt;/h2&gt;
&lt;p&gt;右上の設定アイコン、&lt;svg class=&quot;inline-icon&quot;&gt;&lt;use href=&quot;#icon-settings&quot;/&gt;&lt;/svg&gt;、をクリックするとゲームの設定が変えられます。テストプレイで確認しながら調整できます：&lt;/p&gt;
&lt;ul&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;オーディオ&lt;/strong&gt;：ヒットサウンドや音楽のボリュームを調整できます。&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;ゲームプレイ&lt;/strong&gt;：デバイスによってはレイテンシーが発生するので、オフセットを調整してください（曲が遅れて感じる場合は増やし、早く感じる場合は減らします）。ノーツが出現するスピード（アプローチレート）も変更でき、もっと手応えが欲しいならヒドゥンなどのMODも試せます。&lt;/p&gt;&lt;/li&gt;
&lt;li&gt;&lt;p&gt;&lt;strong&gt;カーソル&lt;/strong&gt;：カーソルのサイズ、色、形、トレイルをカスタマイズしましょう！&lt;/p&gt;&lt;/li&gt;
&lt;/ul&gt;
&lt;p&gt;&lt;strong&gt;mimi&lt;/strong&gt;を&lt;em&gt;あなた&lt;/em&gt;の&lt;strong&gt;マジカルミライ&lt;/strong&gt;に！&lt;/p&gt;'
