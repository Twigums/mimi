server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hakyll emits song pages as <songId>/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?|wav|mp3|json)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
